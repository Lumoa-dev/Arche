# ── Arche pre-commit 配置 ──────────────────────────────────────
# 安装：uv run pre-commit install
# 全量运行：uv run pre-commit run --all-files

repos:
  # ── 通用文件规范 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^frontend/.*\.d\.ts$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # ── 后端：Ruff lint + format ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^backend/tests/|^backend/migrations/
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^backend/tests/|^backend/migrations/

  # ── 前端：ESLint + Prettier ──
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --prefix frontend eslint --fix
        language: system
        types_or: [javascript, jsx, typescript, tsx, vue]
        files: ^frontend/src/

      - id: prettier
        name: prettier
        entry: npx --prefix frontend prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, typescript, tsx, vue, css, html, json, yaml, markdown]
        files: ^frontend/

  # ── commit 信息校验 ──
  - repo: https://github.com/commitlint/pre-commit-hooks
    rev: v10.0.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  # ── 禁止将 debug 代码提交到非测试文件 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
        stages: [commit]
