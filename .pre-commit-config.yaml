# ── Arche pre-commit 配置 ─────────
# 安装：uv run pre-commit install
# 全量运行：uv run pre-commit run --all-files
# 升级钩子版本：uv run pre-commit autoupdate

repos:
  # ── 官方通用钩子（跨平台 Python 实现） ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^frontend/.*\.d\.ts$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # ── 后端：Ruff lint + format ──
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        exclude: ^backend/tests/|^backend/migrations/|^scripts/

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^backend/tests/|^backend/migrations/|^scripts/

      # ── 前端：Prettier + ESLint ──
      - id: prettier
        name: prettier
        entry: npx --prefix frontend prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, vue, css, html, json, yaml, markdown]
        files: ^frontend/

      - id: eslint
        name: eslint
        entry: npx --prefix frontend eslint --config frontend/eslint.config.js --fix
        language: system
        types_or: [javascript, jsx, ts, tsx, vue]
        files: ^frontend/src/

      # ── commit 信息校验 ──
      - id: commitlint
        name: commitlint
        entry: npx --prefix frontend commitlint --edit
        language: system
        stages: [commit-msg]

      # ── 禁止直接提交到 master ──
      - id: no-commit-to-branch
        name: no-commit-to-branch
        entry: python -c "import subprocess,sys; branch=subprocess.run(['git','branch','--show-current'],capture_output=True,text=True).stdout.strip(); sys.exit(0 if branch not in ('master','main') else (print(f'禁止直接提交到 {branch} 分支') or 1))"
        language: system
        stages: [pre-commit]
