name: Report Fail

on:
  workflow_call:
    inputs:
      title:
        description: "Issue 标题（日期自动追加）"
        required: true
        type: string
      labels:
        description: "标签，逗号分隔"
        required: false
        type: string
        default: "auto-generated"
      artifact-name:
        description: "上传的报告文件（内容会附到 Issue 正文）"
        required: false
        type: string
        default: ""
      create-fix-branch:
        description: "是否自动创建修复分支"
        required: false
        type: boolean
        default: false
      branch-prefix:
        description: "分支名前缀（日期自动追加）"
        required: false
        type: string
        default: "fix/failure"

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}

      - name: Create Issue
        uses: actions/github-script@v7
        env:
          TITLE: ${{ inputs.title }}
          LABELS: ${{ inputs.labels }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          CREATE_BRANCH: ${{ inputs.create-fix-branch && 'true' || 'false' }}
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          DATE: ${{ steps.date.outputs.today }}
        with:
          script: |
            const title = process.env.TITLE;
            const labels = process.env.LABELS.split(',').map(l => l.trim());
            const date = process.env.DATE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 读取报告文件
            let artifactContent = '';
            if (process.env.ARTIFACT_NAME) {
              const fs = require('fs');
              try {
                const files = fs.readdirSync('.');
                const reportFile = files.find(f => f.endsWith('.txt') || f.endsWith('.log'));
                if (reportFile) {
                  const content = fs.readFileSync(reportFile, 'utf8');
                  const maxLen = 60000;
                  artifactContent = content.length > maxLen
                    ? content.slice(0, maxLen) + '\n\n...（完整报告请查看 Artifact）'
                    : content;
                }
              } catch(e) {
                artifactContent = '（无法读取报告文件）';
              }
            }

            // 组装正文
            const bodyParts = [
              `## ${title}`,
              '',
              `**运行时间**: ${new Date().toISOString()}`,
              `**触发方式**: ${context.eventName}`,
              `**Run**: [${runUrl}](${runUrl})`,
              '',
            ];

            if (artifactContent) {
              bodyParts.push('```');
              bodyParts.push(artifactContent);
              bodyParts.push('```');
              bodyParts.push('');
            }

            bodyParts.push('> 此 Issue 由 CI 自动创建，请在修复后关闭。');

            if (process.env.CREATE_BRANCH === 'true') {
              const branch = `${process.env.BRANCH_PREFIX}-${date}`;
              bodyParts.push('');
              bodyParts.push('### 修复分支');
              bodyParts.push('');
              bodyParts.push(`已自动创建分支 \`${branch}\` 基于本次失败的 commit。`);
            }

            // 建 Issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${title} (${date})`,
              labels: labels,
              body: bodyParts.join('\n'),
            });

      # ── 建修复分支 ──
      - name: Create fix branch
        if: inputs.create-fix-branch
        run: |
          BRANCH="${{ inputs.branch-prefix }}-${{ steps.date.outputs.today }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
