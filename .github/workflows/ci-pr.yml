name: CI - PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  check-lint:
    uses: ./.github/workflows/check-lint.yml

  check-security:
    uses: ./.github/workflows/check-security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # ── 后端核心测试 ──
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Run core tests
        run: uv run pytest backend/tests/core/ --tb=short --no-header

  # ── 后端插件测试（矩阵并行） ──
  test-plugin-py:
    strategy:
      matrix:
        plugin:
          - asset_mgmt
          - auth
          - blog
          - cloud_integration
          - config_mgmt
          - crawler
          - deploy_webhook
          - github_proxy
          - ip_ban
          - oss
          - request_log
          - search
          - system_monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Run ${{ matrix.plugin }} tests
        run: uv run pytest backend/tests/plugins/${{ matrix.plugin }}/ --tb=short --no-header

  # ── 后端边界/安全测试 ──
  test-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Run edge case tests
        run: uv run pytest backend/tests/edge_cases/ --tb=short --no-header

  # ── 前端单元测试 ──
  test-unit-js:
    strategy:
      matrix:
        dir:
          - composables
          - constants
          - directives
          - integration
          - router
          - services
          - store
          - utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run ${{ matrix.dir }} tests
        working-directory: frontend
        run: npx vitest run src/tests/${{ matrix.dir }}/ --reporter=verbose

  # ── 集成测试（PostgreSQL + -m real） ──
  test-real-py:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arche_test
      SECRET_KEY: ci-test-secret-key-for-real-tests
      ARCHE_TEST_REAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Run real backend tests
        run: uv run pytest backend/tests/ -m "real" -v --tb=long --no-header -p no:cacheprovider

  # ── 前端集成测试 ──
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend integration tests
        working-directory: frontend
        run: npx vitest run src/tests/integration/ --reporter=verbose

  # ── E2E 测试 ──
  test-e2e:
    strategy:
      matrix:
        browser: ${{ fromJSON('["chromium"]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arche_test
      SECRET_KEY: ci-test-secret-key-for-real-tests
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}
      - name: Start backend
        run: |
          nohup uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 --log-level warning > /tmp/backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/ping > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Start frontend
        working-directory: frontend
        run: |
          npm install
          npm run dev -- --host 127.0.0.1 --port 5173 &
          sleep 3
      - name: Run E2E tests (skip if directory missing)
        run: |
          if [ -d backend/tests/e2e ]; then
            uv run pytest backend/tests/e2e/ --browser=${{ matrix.browser }} --frontend-url=http://127.0.0.1:5173 --tb=short --no-header
          else
            echo "E2E tests directory not found, skipping"
          fi
