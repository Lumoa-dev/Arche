name: Test Integration

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # ── 真实外部服务集成测试（PostgreSQL + -m "real"） ──
  test-real-py:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arche_test
      SECRET_KEY: ci-test-secret-key-for-real-tests
      ARCHE_TEST_REAL: "1"

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen

      - name: Run real backend tests
        run: uv run pytest backend/tests/ -m "real" -v --tb=long --no-header -p no:cacheprovider

  # ── 前端集成测试 ──
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend integration tests
        working-directory: frontend
        run: npx vitest run src/tests/integration/ --reporter=verbose
