name: Test Integration

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test-integration-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run integration tests
        run: uv run pytest backend/tests/integration/ -n auto --tb=short --no-header

  test-attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run attack tests
        run: uv run pytest backend/tests/adversarial/ -v --tb=long --no-header

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend integration tests
        working-directory: frontend
        run: npx vitest run src/tests/integration/ --reporter=verbose
