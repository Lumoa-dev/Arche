name: Test Unit

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      backend-plugins: ${{ steps.scan-backend.outputs.matrix }}
      frontend-dirs: ${{ steps.scan-frontend.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Scan backend unit test dirs
        id: scan-backend
        run: |
          MATRIX=$(ls -1d backend/tests/unit/*/ 2>/dev/null | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Scan frontend test dirs
        id: scan-frontend
        run: |
          MATRIX=$(ls -1d frontend/src/tests/*/ 2>/dev/null | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test-unit-py:
    needs: [setup]
    if: needs.setup.outputs.backend-plugins != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.setup.outputs.backend-plugins) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run ${{ matrix.plugin }} unit tests
        run: uv run pytest backend/tests/unit/${{ matrix.plugin }}/ -n auto --tb=short --no-header

  test-unit-js:
    needs: [setup]
    if: needs.setup.outputs.frontend-dirs != '[]'
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.setup.outputs.frontend-dirs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run ${{ matrix.dir }} tests
        working-directory: frontend
        run: npx vitest run src/tests/${{ matrix.dir }}/ --reporter=verbose
