name: Test Unit

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test-unit-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run all backend unit tests
        run: |
          for dir in backend/tests/unit/*/; do
            plugin=$(basename "$dir")
            echo "=== $plugin ==="
            uv run pytest "backend/tests/unit/$plugin/" -n auto --tb=short --no-header
          done

  test-unit-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run all frontend unit tests
        working-directory: frontend
        run: |
          for dir in src/tests/*/; do
            testdir=$(basename "$dir")
            echo "=== $testdir ==="
            npx vitest run "src/tests/$testdir/" --reporter=verbose
          done
