name: Test Unit

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test-unit-py:
    strategy:
      matrix:
        plugin:
          - asset_mgmt
          - auth
          - blog
          - cloud_integration
          - core
          - crawler
          - github_proxy
          - monitor
          - oss
          - search
          - system_monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run ${{ matrix.plugin }} unit tests
        run: uv run pytest backend/tests/unit/${{ matrix.plugin }}/ -n auto --tb=short --no-header

  test-unit-js:
    strategy:
      matrix:
        dir:
          - composables
          - constants
          - directives
          - integration
          - pipeline
          - router
          - services
          - store
          - utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run ${{ matrix.dir }} tests
        working-directory: frontend
        run: npx vitest run src/tests/${{ matrix.dir }}/ --reporter=verbose
