name: Test Unit

on:
  workflow_call:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # ── 后端核心测试 ──
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run core tests
        run: uv run pytest backend/tests/core/ -n auto --tb=short --no-header

  # ── 后端插件测试（矩阵并行） ──
  test-plugin-py:
    strategy:
      matrix:
        plugin:
          - asset_mgmt
          - auth
          - blog
          - cloud_integration
          - config_mgmt
          - crawler
          - deploy_webhook
          - github_proxy
          - ip_ban
          - monitor
          - oss
          - request_log
          - search
          - system_monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run ${{ matrix.plugin }} tests
        run: uv run pytest backend/tests/plugins/${{ matrix.plugin }}/ -n auto --tb=short --no-header

  # ── 后端边界/安全测试 ──
  test-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run edge case tests
        run: uv run pytest backend/tests/edge_cases/ -n auto --tb=short --no-header

  # ── 前端单元测试 ──
  test-unit-js:
    strategy:
      matrix:
        dir:
          - composables
          - constants
          - directives
          - integration
          - router
          - services
          - store
          - utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run ${{ matrix.dir }} tests
        working-directory: frontend
        run: npx vitest run src/tests/${{ matrix.dir }}/ --reporter=verbose
