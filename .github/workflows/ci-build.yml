name: CI - Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-integration:
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit

  test-e2e:
    uses: ./.github/workflows/test-e2e.yml

  build:
    needs: [test-integration, test-e2e]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    needs: [build]
    if: needs.build.outputs.image_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  deploy:
    needs: [build]
    if: needs.build.outputs.image_tag != ''
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
