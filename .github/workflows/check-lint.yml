name: Check Lint

on:
  workflow_call:

jobs:
  # ── 检查 Python 代码 ──
  check-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run ruff lint
        run: uv run ruff check backend/
      - name: Check format
        run: uv run ruff format --check backend/
      - name: Run custom rules
        run: uv run python scripts/lint_rules.py --fail backend/
      - name: Check type
        run: uv run mypy backend/

  # ── 检查 JS/TS 代码 ──
  check-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run eslint
        working-directory: frontend
        run: npm run lint
      - name: Check format
        working-directory: frontend
        run: npm run format -- --check
      - name: Check type
        working-directory: frontend
        run: npm run type-check
      - name: Test build
        working-directory: frontend
        run: npm run build
