name: Check Security

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # ── 找改动（判断跑哪些扫描） ──
  find-changes:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.build.outputs.languages }}
      run-py-scan: ${{ steps.build.outputs.run-py-scan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed code
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            python:
              - 'backend/**/*.py'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'backend/pyproject.toml'
            javascript:
              - 'frontend/src/**/*.{ts,js,vue}'
              - 'frontend/src/**/*.{tsx,jsx}'
              - 'frontend/package.json'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.ts'

      - name: Build language list
        id: build
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'languages=["python","javascript"]' >> $GITHUB_OUTPUT
            echo "run-py-scan=true" >> $GITHUB_OUTPUT
          else
            CHANGES='${{ steps.filter.outputs.changes }}'
            echo "languages=$CHANGES" >> $GITHUB_OUTPUT

            if echo "$CHANGES" | jq -e 'contains(["python"])' > /dev/null 2>&1; then
              echo "run-py-scan=true" >> $GITHUB_OUTPUT
            else
              echo "run-py-scan=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ── 扫 Python 安全 ──
  scan-py:
    needs: [find-changes]
    if: needs.find-changes.outputs.run-py-scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Run security scan
        run: >
          uv run bandit -r backend/
          --skip B101,B311
          --confidence-level high
          --severity-level high
          --quiet

  # ── 扫代码（CodeQL，PR 才跑） ──
  scan-code:
    needs: [find-changes]
    if: |
      needs.find-changes.outputs.languages != '[]' &&
      github.event_name != 'push'
    strategy:
      matrix:
        language: ${{ fromJSON(needs.find-changes.outputs.languages) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Init scan
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Auto build
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL scan
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

