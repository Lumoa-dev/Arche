name: Test E2E

on:
  workflow_call:
    inputs:
      browsers:
        description: 'Browsers to run (JSON array)'
        default: '["chromium", "firefox"]'
        type: string

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arche_test
      SECRET_KEY: ci-test-secret-key-for-real-tests

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}
      - name: Start backend
        run: |
          nohup uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 --log-level warning > /tmp/backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/ping > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Start frontend
        working-directory: frontend
        run: |
          npm install
          npm run dev -- --host 127.0.0.1 --port 5173 &
          sleep 3
      - name: Run E2E tests
        run: uv run pytest backend/tests/e2e/ --browser=${{ matrix.browser }} --frontend-url=http://127.0.0.1:5173 --tb=short --no-header
