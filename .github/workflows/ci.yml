name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
  workflow_dispatch:

jobs:
  check-lint:
    uses: ./.github/workflows/check-lint.yml

  check-security:
    if: github.event_name != 'push'
    uses: ./.github/workflows/check-security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # PR：只跑单元测试
  test-unit:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-unit.yml

  # 合并到 master / tag push：跑集成 + E2E
  test-integration:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-integration.yml
    permissions:
      contents: write
      issues: write

  test-e2e:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-e2e.yml

  build:
    needs: [check-lint, test-integration, test-e2e]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    needs: [build]
    if: needs.build.outputs.image_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  deploy:
    needs: [build]
    if: needs.build.outputs.image_tag != ''
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
