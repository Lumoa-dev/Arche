name: Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        type: string
        default: "latest"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        type: string
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: >
          curl -sf -X POST "${{ vars.DEPLOY_WEBHOOK_URL }}"
          -H "Content-Type: application/json"
          -d '{"token":"${{ secrets.DEPLOY_TOKEN }}","tag":"${{ inputs.image_tag }}"}'
