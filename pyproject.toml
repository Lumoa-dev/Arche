[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arche"
version = "0.4.0"
description = "Personal modular platform - microkernel architecture"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "alembic>=1.18.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-multipart>=0.0.26",
    "psutil>=5.9",  # System monitoring
    "aliyun-python-sdk-core>=2.13",  # Aliyun ECS SDK (cloud training provider)
    "aliyun-python-sdk-ecs>=4.24",
    "oss2>=2.18",  # Aliyun OSS SDK
    "minio>=7.2",  # MinIO SDK (local object storage)
    "asyncssh>=2.14",  # SSH/SFTP (cloud training remote deployment)
    "python-docx>=1.1",  # DOCX parsing (blog import)
    "aiosqlite>=0.20",  # SQLite async driver (dev default)
    "asyncpg>=0.30",  # PostgreSQL async driver (production)
    "pydantic-settings>=2.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/"]
exclude = ["backend/tests", "backend/scripts", "**/__pycache__"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.11",
    "pytest-playwright>=0.8.0",
    "typer>=0.26.7",
    "tree-sitter>=0.25.2",
    "tree-sitter-typescript>=0.23.2",
    "bandit>=1.8.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "taskipy>=1.14.1",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/migrations/*",
    "backend/*/__init__.py",
    "backend/scripts/*",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
norecursedirs = [".venv", "node_modules", "frontend", "scripts", "e2e"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: 标记慢速测试（需要网络）",
    "integration: 标记集成测试",
    "e2e: 标记端到端测试",
    "cli: 标记需要 GitHub CLI 的测试",
    "http: 标记需要 HTTP 连接的测试",
    "real: 标记需要真实外部服务的测试（仅 CI 运行）",
    "plugin: 标记插件级测试",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific rules
    "E501",  # line-too-long (tests have long fixture lines)
]
ignore = [
    "RUF001",  # ambiguous-unicode-character-string — 项目使用中文，误报过多
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = [
    "ARG001",
    "ARG002",
    "ARG005",
    "N802",
    "N806",
    "E501"
]
"backend/migrations/*" = [
    "ARG001",
    "ARG002",
    "E501",
    "F821",
    "I001",
    "UP",
    "W291"
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "backend.tests.*",
    "backend/migrations/*",
    "backend/plugins/*/__init__",
]
ignore_errors = true

[tool.taskipy.tasks]
# ── 安装 ──
install = "uv sync && cd frontend && npm install"

# ── Lint ──
lint = "task lint-backend && task lint-frontend"
lint-backend = "uv run ruff check backend/ && uv run python scripts/lint_rules.py --fail backend/"
lint-frontend = "cd frontend && npm run lint"

# ── 格式化 ──
format = "task format-backend && task format-frontend"
format-backend = "uv run ruff format backend/"
format-frontend = "cd frontend && npm run format"
format-check = "task format-check-backend && task format-check-frontend"
format-check-backend = "uv run ruff format --check backend/"
format-check-frontend = "cd frontend && npm run format -- --check"

# ── 类型检查 ──
type-check = "task type-check-backend && task type-check-frontend"
type-check-backend = "uv run mypy backend/ --no-error-summary"
type-check-frontend = "cd frontend && npm run type-check"

# ── 测试 ──
test = "task test-backend && task test-frontend"
test-backend = "uv run pytest backend/tests/ -m 'not real' -q --tb=short"
test-frontend = "cd frontend && npm run test:run"

# 增量/分组测试
test-core = "uv run pytest backend/tests/core/ -q --tb=short"
test-edge = "uv run pytest backend/tests/edge_cases/ -q --tb=short"
test-plugin = "uv run pytest backend/tests/plugins/{args} -q --tb=short"
test-all = "uv run pytest backend/tests/ -m 'not real' -q --tb=short"
test-changed = "python scripts/test_changed.py"

# ── 构建 ──
build = "cd frontend && npm run build"

# ── 本地质量门（format → lint → type → test → build） ──
check = "task format && task lint && task type-check && task test && task build"
check-on-test = "task format && task lint && task type-check  && task build"

# ── 清理 ──
clean = "uv run python -c \"import shutil, pathlib; [shutil.rmtree(p) for p in [pathlib.Path('frontend/dist'), pathlib.Path('.ruff_cache'), pathlib.Path('.mypy_cache'), pathlib.Path('.pytest_cache')] if p.exists()]\""
